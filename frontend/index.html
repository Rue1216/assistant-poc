<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>行銷人員顧問小幫手 POC</title>
    <script>
      // Apply the saved theme (or the system preference) before first paint; key matches use-theme.ts
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('platform-theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
